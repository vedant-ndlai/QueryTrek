services:
  # Database Services
  sybase:
    build:
      context: ./docker/sybase
      dockerfile: Dockerfile
    container_name: vmigrateagent-sybase
    ports:
      - "5000:5000"
    environment:
      - SYBASE_USER=sa
      - SYBASE_PASSWORD=sybase123
    volumes:
      - sybase-data:/opt/sybase/data
    networks:
      - vmigrateagent-network
    healthcheck:
      test: ["CMD", "/opt/sybase/bin/isql", "-U", "sa", "-P", "sybase123", "-S", "SYBASE"]
      interval: 30s
      timeout: 10s
      retries: 5

  neo4j:
    image: neo4j:5.8.0
    container_name: vmigrateagent-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - neo4j-data:/data
    networks:
      - vmigrateagent-network
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vmigrateagent-rabbitmq
    ports:
      - "5672:5672"  # AMQP
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - vmigrateagent-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vmigrateagent-backend
    ports:
      - "8000:8000"  # FastAPI
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./src:/app/src
      - ./output:/app/output
    networks:
      - vmigrateagent-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: uvicorn src.api.api:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vmigrateagent-frontend
    ports:
      - "3000:3000"  # React
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - vmigrateagent-network
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    command: npm start

volumes:
  sybase-data:
  neo4j-data:
  rabbitmq-data:

networks:
  vmigrateagent-network:
    driver: bridge
